# Animal2Vec 1.0 reproduction baseline: official spotted-hyena pretraining.
# This is a native PyTorch recipe for ten-second, 24 kHz recordings.
# Replace task.data with a directory containing pretrain.tsv.

# AMP scale coordinates reproduce the archived numerical regime.
common:
  fp16: true
  log_interval: 1418  # Emit stdout and TensorBoard scalars every 1,418 updates.
  tensorboard_logdir: tb  # Relative paths live below checkpoint.save_dir.
  fp16_init_scale: 1
  min_loss_scale: 1e-6

# Save a numbered checkpoint every ten epochs plus checkpoint_last.pt.
checkpoint:
  save_interval: 10

# Each convolution triple is (output channels, kernel samples, stride). Their
# combined stride is 120, mapping 24,000 waveform samples/s to about 200 frames/s.
task:
  data: /local/datasets/Hyena_10s_energy_event_detected_pretrain_only_2024-09-03/manifests
  sample_rate: 24000
  normalize: true
  conv_feature_layers: '[(127, 63, 1)] +[(512, 10, 5)] + [(512, 3, 4)] + [(512, 3, 3)] + [(512, 3, 2)] + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1
  enable_padding: false  # Crop a batch to common length instead of padding.

# Effective samples/update = max_tokens × world_size × update_freq. At the
# paper topology, 3,000,000 × 4 × 2 samples correspond to 1,000 audio seconds.
dataset:
  num_workers: 32
  max_tokens: 3000000
  required_batch_size_multiple: 1
  train_subset: pretrain
  disable_validation: true

# Original paper topology. Deployment scripts may override this launch guard.
distributed_training:
  distributed_world_size: 4

# Two microbatches per rank contribute to each of approximately 100 epochs.
optimization:
  update_freq: [2]
  max_update: 1417431
  clip_norm: 1
  lr: [0.00025]

# Adam uses Fairseq-compatible epsilon placement and decoupled weight decay.
optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1e-6
  weight_decay: 0.01

# Linear warmup is followed by cosine decay over the remaining update horizon.
lr_scheduler:
  warmup_updates: 10000

# The base student and EMA teacher use 12 blocks of width 768.
model:
  depth: 12
  embed_dim: 768
  num_heads: 12
  clone_batch: 8

  # theta_teacher <- d(u) theta_teacher + (1-d(u)) theta_student.
  ema_decay: 0.9997
  ema_end_decay: 1
  ema_anneal_end_step: 300000

  # Average all 12 teacher block outputs after per-block instance normalization.
  average_top_k_layers: 12
  instance_norm_target_layer: true
  layer_norm_target_layer: false
  layer_norm_targets: false

  layerdrop: 0
  norm_eps: 1e-5

  # Mix every source using one batch-shared ratio from [0.5, 1.0], with gain
  # estimated over 50 ms A-weighted windows.
  source_mixup: 0.5
  mixup_prob: 1.0
  same_mixup: true
  mixing_window_length: 0.05
  gain_mode: A_weighting

  # beta=0 selects squared regression error on masked frames.
  loss_beta: 0
  loss_scale: null

  modalities:
    audio:
      # Sinc filters and pSwish form the learnable local acoustic frontend.
      sinc_input: true
      apply_window_to_root: false
      use_pswish: true
      sinc_norm: layer_norm

      # The Hyena base recipe has no Transformer prenet.
      conv_pos_depth: 5
      conv_pos_width: 95
      conv_pos_groups: 16
      prenet_depth: 0

      # Draw about mask_prob*T/mask_length starts. The value 1.5 is a dense
      # span-start rate, not a Bernoulli probability, and overlap is allowed.
      mask_prob: 1.5
      mask_length: 2
      mask_noise_std: 0.01
      mask_dropout: 0

      # ALiBi has one learned scale per attention head.
      use_alibi_encoder: true
      learned_alibi_scale: true
      learned_alibi_scale_per_head: true

      # Reconstruct every time position, then score only masked positions.
      decoder:
        input_dropout: 0.1
        decoder_dim: 384
        decoder_groups: 16
        decoder_kernel: 7
        decoder_layers: 4
