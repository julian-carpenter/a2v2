# Animal2Vec 1.0 reproduction baseline: spotted-hyena full-data fine-tuning.
# It predicts nine call classes plus a focal indicator from the base encoder.
# Replace task.data and model.w2v_path before launching the experiment.

# AMP reduces accelerator memory; metrics are emitted every 361 updates.
common:
  fp16: true
  log_interval: 361
  tensorboard_logdir: tb

# Save every ten epochs. checkpoint_best.pt tracks validation frame F1 unless
# best_checkpoint_metric is changed to segmented_f1.
checkpoint:
  save_interval: 10
  best_checkpoint_metric: metrics/finetune/f1

# The class order defines output columns. Combined convolution stride 120 maps
# 24 kHz audio to about 200 encoder frames/s and must match pretraining.
task:
  data: /home/jupyter-jzimmermann/ml/datasets/Hyena_10s_2025-10-28/manifests
  sample_rate: 24000
  normalize: true
  with_labels: true
  unique_labels: "['groan', 'oth', 'whoop', 'alarm_rumble', 'squitter', 'squeal', 'feeding', 'giggle', 'growl', 'focal']"
  conv_feature_layers: '[(127, 63, 1)] +[(512, 10, 5)] + [(512, 3, 4)] + [(512, 3, 3)] + [(512, 3, 2)] + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1000
  max_sample_size: 320000
  min_label_size: 2936  # Keep label files strictly larger than this byte count.

# Effective samples/update = 285,000 × 4 ranks × 11 microbatches.
dataset:
  num_workers: 20
  max_tokens: 285_000
  train_subset: train_0
  valid_subset: valid_0
  validate_after_updates: 10000
  validate_interval_updates: 5000
  validate_interval: 5000  # Suppress ordinary epoch-triggered validation.

# Original paper topology; deployment scripts may override this launch guard.
distributed_training:
  distributed_world_size: 4

# Independent sigmoid focal losses train every label. Segments are produced by
# 100 ms average pooling and require strict IoU > 0 for an overlap match.
criterion:
  focal_alpha: 0.25
  focal_gamma: 2.0
  metric_threshold: 0.175
  method: avg
  sigma_s: 0.1
  iou_threshold: 0.0

# Eleven microbatches form an update. The first 10,000 updates train only the
# classifier; the remaining 20,000 also adapt Transformer blocks.
optimization:
  update_freq: [11]
  max_update: 30000
  lr: [0.0001]

# Adam uses Fairseq-compatible epsilon placement.
optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1e-08

# Warm up linearly from 1e-10, then decay by cosine to 5e-6.
lr_scheduler:
  warmup_updates: 2000
  warmup_init_lr: 1e-10
  min_lr: 5e-06

# Keep the local Sinc/convolution frontend frozen and unfreeze the Transformer
# after the classifier-only phase.
model:
  w2v_path: ???
  freeze_finetune_updates: 10000
  feature_grad_mult: 0.0

  # Average all 12 pretrained Transformer block outputs.
  average_top_k_layers: 12

  # Use four-frame time spans. Channel masking is omitted because the archived
  # Hyena recipe sets its probability to zero.
  apply_mask: true
  mask_prob: 0.825
  mask_length: 4
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.2
  layerdrop: 0.1

  # Mix every waveform and its targets with one batch-shared ratio from
  # [0.5, 1.0], using 50 ms A-weighted gain estimates.
  target_mixup: true
  source_mixup: 0.5
  mixup_prob: 1.0
  same_mixup: true
  mixing_window_length: 0.05
  gain_mode: A_weighting
