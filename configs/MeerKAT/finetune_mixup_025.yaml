# Animal2Vec 1.0 reproduction baseline: MeerKAT 25% fine-tuning, fold 0.
# It trains a 12-label frame classifier from the large pretrained encoder.
# Replace task.data and model.w2v_path before launching the experiment.

# AMP reduces accelerator memory; log every 271 optimizer updates.
common:
  fp16: true
  log_interval: 271
  tensorboard_logdir: tb

# Numbered checkpoints are written every 13 epochs; checkpoint_best.pt tracks
# validation frame F1 unless changed explicitly to segmented_f1.
checkpoint:
  save_interval: 13
  best_checkpoint_metric: metrics/finetune/f1

# The class order fixes output columns. Frontend geometry must exactly equal
# the 8 kHz pretraining checkpoint and emits about 200 frames/s.
task:
  data: /path/to/manifest_files
  sample_rate: 8000
  normalize: true
  with_labels: true
  unique_labels: "['beep', 'synch', 'sn', 'cc', 'ld', 'oth', 'mo', 'al', 'soc', 'agg', 'eating', 'focal']"
  conv_feature_layers: '[(127, 63, 1)] +[(512, 10, 5)] + [(512, 3, 2)] * 3 + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1000
  max_sample_size: 320000
  min_label_size: 3032

# Effective samples/update = 426,667 × 4 ranks × 9 microbatches.
dataset:
  num_workers: 20
  max_tokens: 426_667
  train_subset: train_0_few_2
  valid_subset: valid_0
  validate_after_updates: 10000
  validate_interval_updates: 750
  validate_interval: 1000  # Suppress ordinary epoch-triggered validation.

# Original paper topology; deployment scripts may override this launch guard.
distributed_training:
  distributed_world_size: 4

# Independent sigmoid focal losses train all labels. Validation average-pools
# probabilities for 100 ms and accepts any strictly positive temporal overlap.
criterion:
  focal_alpha: 0.25
  focal_gamma: 2.0
  metric_threshold: 0.175
  method: avg
  sigma_s: 0.1
  iou_threshold: 0.0

# Nine microbatches form an update. The first 10,000 updates train only the
# classifier; the remaining 8,000 also update the Transformer.
optimization:
  update_freq: [9]
  max_update: 18000
  lr: [0.000075]

optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1e-08

# Warm up linearly from 1e-10, then decay by cosine to 5e-6.
lr_scheduler:
  warmup_updates: 2000
  warmup_init_lr: 1e-10
  min_lr: 5e-06

# Keep the local acoustic frontend frozen and unfreeze the Transformer after
# the classifier-only phase.
model:
  w2v_path: ???
  freeze_finetune_updates: 10000
  feature_grad_mult: 0.0

  # Average all 16 pretrained block outputs for classification.
  average_top_k_layers: 16

  # Dense time and channel masks regularize the supervised encoder.
  apply_mask: true
  mask_prob: 1.0
  mask_length: 3
  mask_channel_prob: 0.5
  mask_channel_length: 64
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.2
  layerdrop: 0.1

  # Mix every waveform and its targets with one batch-shared ratio from
  # [0.5, 1.0], using 50 ms A-weighted gain estimates.
  target_mixup: true
  source_mixup: 0.5
  mixup_prob: 1.0
  same_mixup: true
  mixing_window_length: 0.05
  gain_mode: A_weighting
