# Animal2Vec 1.0 reproduction baseline: MeerKAT full-data fine-tuning, fold 0.
# It trains a 12-label frame classifier from the large pretrained encoder.
# Replace task.data and model.w2v_path before launching the experiment.

# AMP reduces accelerator memory; progress is written every nominal paper epoch.
common:
  fp16: true
  log_interval: 361
  tensorboard_logdir: tb  # Relative paths live below checkpoint.save_dir.

# Save every ten epochs. checkpoint_best.pt tracks validation frame F1; change
# this to segmented_f1 when event overlap should select the deployed model.
checkpoint:
  save_interval: 10
  best_checkpoint_metric: metrics/finetune/f1

# Label order defines classifier columns. The convolution specification must
# exactly equal the pretrained checkpoint geometry (about 200 frames/s).
task:
  data: /path/to/manifest_files
  sample_rate: 8000
  normalize: true
  with_labels: true
  unique_labels: "['beep', 'synch', 'sn', 'cc', 'ld', 'oth', 'mo', 'al', 'soc', 'agg', 'eating', 'focal']"
  conv_feature_layers: '[(127, 63, 1)] +[(512, 10, 5)] + [(512, 3, 2)] * 3 + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1000
  max_sample_size: 320000  # Crop training examples to at most 40 seconds.
  min_label_size: 3032  # Keep label files strictly larger than this byte count.

# Effective samples/update = 426,667 × 4 ranks × 9 microbatches.
dataset:
  num_workers: 20
  max_tokens: 426_667
  train_subset: train_0
  valid_subset: valid_0
  validate_after_updates: 10000  # First event-aware validation.
  validate_interval_updates: 5000  # Then validate every 5,000 updates.
  validate_interval: 5000  # Suppress ordinary epoch-triggered validation.

# Original paper topology; deployment scripts may override this launch guard.
distributed_training:
  distributed_world_size: 4

# Sigmoid focal loss is applied independently to all 12 labels:
# FL(p_t) = -alpha_t (1-p_t)^gamma log(p_t).
criterion:
  focal_alpha: 0.25
  focal_gamma: 2.0
  metric_threshold: 0.175  # Pooled probability required for a predicted event.
  method: avg  # Average-pool frame probabilities before thresholding.
  sigma_s: 0.1  # Pool over 100 ms at the encoder frame rate.
  iou_threshold: 0.0  # Archived strict test: a match requires IoU > 0.

# Nine microbatches form an update. The classifier-only phase occupies the
# first 10,000 of 30,000 updates; the learning rate is 3e-5.
optimization:
  update_freq: [9]
  max_update: 30000
  lr: [0.00003]

# Adam uses Fairseq-compatible epsilon placement.
optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1e-08

# Linear warmup from 1e-10 is followed by cosine decay to 5e-6.
lr_scheduler:
  warmup_updates: 2000
  warmup_init_lr: 1e-10
  min_lr: 5e-06

# The local convolution/Sinc frontend remains frozen. The classifier trains
# alone for 10,000 updates, after which Transformer gradients are enabled.
model:
  w2v_path: ???
  freeze_finetune_updates: 10000
  feature_grad_mult: 0.0

  # Average all 16 pretrained Transformer block outputs for classification.
  average_top_k_layers: 16

  # Time masking draws about 0.825*T/4 spans; channel masking draws about
  # 0.5*1024/64 channel spans. Both apply only during supervised training.
  apply_mask: true
  mask_prob: 0.825
  mask_length: 4
  mask_channel_prob: 0.5
  mask_channel_length: 64

  # These rates replace the pretrained encoder's dropout coordinates.
  dropout: 0.1
  activation_dropout: 0.1
  attention_dropout: 0.2
  layerdrop: 0.1

  # Mix every waveform and its frame targets with the same batch-wide ratio
  # sampled from [0.5, 1.0], using 50 ms A-weighted gain estimates.
  target_mixup: true
  source_mixup: 0.5
  mixup_prob: 1.0
  same_mixup: true
  mixing_window_length: 0.05
  gain_mode: A_weighting
