# Animal2Vec 1.0 reproduction baseline: official MeerKAT large pretraining.
# This is a native PyTorch recipe, not a Hydra/Fairseq component. Replace
# task.data with a directory containing pretrain.tsv.

# AMP performs matrix operations in reduced precision. The initial scale of
# one and 1e-6 lower bound reproduce the archived run's conservative scaling.
common:
  fp16: true
  log_interval: 384  # Emit stdout and TensorBoard scalars every 384 updates.
  tensorboard_logdir: tb  # Relative paths live below checkpoint.save_dir.
  fp16_init_scale: 1
  min_loss_scale: 1e-6

# Save a numbered checkpoint every ten epochs and replace checkpoint_last.pt
# after each save. The native trainer does not delete epoch checkpoints, so
# the old keep_last_epochs option had no effect.
checkpoint:
  save_interval: 10

# A convolution triple is (output channels, kernel samples, stride). The total
# stride is 40, so 8,000 samples/s become about 200 feature frames/s. Label
# metadata is omitted because the self-supervised objective never reads it.
task:
  data: /path/to/manifest_files
  sample_rate: 8000
  normalize: true  # Standardize each waveform before feature extraction.
  conv_feature_layers: '[(127, 63, 1)] +[(512, 10, 5)] + [(512, 3, 2)] * 3 + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1  # Accept every nonempty manifest recording.
  enable_padding: false  # Crop batches to a common length instead of padding.

# One rank receives at most 408,000 waveform samples per DataLoader batch.
# Effective samples/update = max_tokens × world_size × update_freq.
dataset:
  num_workers: 32
  max_tokens: 408_000
  required_batch_size_multiple: 1
  train_subset: pretrain
  disable_validation: true  # Self-supervised training has no labeled metric.

# The paper recipe used four ranks. The eight-A100 reproduction script
# overrides this guard to eight.
distributed_training:
  distributed_world_size: 4

# Five microbatches per rank form one optimizer update. The paper's
# 384,230-update schedule covers about 100 epochs.
optimization:
  update_freq: [5]
  max_update: 384230
  clip_norm: 1
  lr: [0.0001]

# Adam uses Fairseq-compatible epsilon placement and decoupled weight decay.
optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1e-6
  weight_decay: 0.01

# Learning rate rises linearly for 10,000 updates, then follows cosine decay
# over the remaining configured horizon.
lr_scheduler:
  warmup_updates: 10000

# The student and EMA teacher are 16-layer, 1,024-dimensional encoders.
model:
  depth: 16
  embed_dim: 1024
  num_heads: 16
  clone_batch: 12  # Twelve independently masked views share each frontend pass.

  # At update u, the teacher parameters follow
  # theta_teacher <- d(u) theta_teacher + (1-d(u)) theta_student.
  ema_decay: 0.9997
  ema_end_decay: 1
  ema_anneal_end_step: 300000

  # Targets average the final 16 teacher block outputs. Instance normalization
  # is applied to each block before averaging; no layer normalization follows.
  average_top_k_layers: 16
  instance_norm_target_layer: true
  layer_norm_target_layer: false
  layer_norm_targets: false

  layerdrop: 0  # Execute every Transformer block during pretraining.
  norm_eps: 1e-5

  # Every source is mixed with another recording. A single ratio drawn between
  # 0.5 and 1.0 is shared by the batch; gain uses 50 ms A-weighted windows.
  source_mixup: 0.5
  mixup_prob: 1.0
  same_mixup: true
  mixing_window_length: 0.05
  gain_mode: A_weighting

  # beta=0 selects squared regression error on masked frames. A null scale lets
  # the loss use its native sample-size normalization.
  loss_beta: 0
  loss_scale: null

  modalities:
    audio:
      # The first convolution is parameterized as Sinc filters, followed by
      # pSwish activations and layer-normalized local features.
      sinc_input: true
      apply_window_to_root: false
      use_pswish: true
      sinc_norm: layer_norm

      # Five grouped convolutions encode relative position. Eight prenet
      # Transformer blocks run before the shared 16-layer encoder.
      conv_pos_depth: 5
      conv_pos_width: 95
      conv_pos_groups: 16
      prenet_depth: 8

      # The mask sampler draws approximately mask_prob*T/mask_length span
      # starts. Overlap permits mask_prob > 1; 1.5 with length two reproduces
      # the paper's dense masking rather than a 150% Bernoulli probability.
      mask_prob: 1.5
      mask_length: 2
      mask_noise_std: 0.01
      mask_dropout: 0

      # ALiBi supplies distance bias; each head learns its own scale.
      use_alibi_encoder: true
      prenet_dropout: 0.1
      learned_alibi_scale: true
      learned_alibi_scale_per_head: true

      # The decoder reconstructs the full time axis from unmasked student
      # context before regression is evaluated only at masked positions.
      decoder:
        input_dropout: 0.1
        decoder_dim: 768
        decoder_groups: 16
        decoder_kernel: 7
        decoder_layers: 4
