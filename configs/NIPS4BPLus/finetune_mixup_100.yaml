# @package _group_
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d_%H-%M-%S}_ft_few_0-1_1-2_NIPS4B

common:
  fp16: true
  log_format: json
  log_interval: 5  # this is in steps, not epochs ... log every three epochs.
  tensorboard_logdir: tb
  all_gather_list_size: 6500000

checkpoint:
  save_interval: 284  # that is every 429 updates
  keep_last_epochs: 10  # keep roughly all seven finetuning and the last three freeze update checkpoints
  best_checkpoint_metric: metrics/finetune/f1

task:
  _name: audio_ccas
  data: /local/datasets/NIPS4B_BIRD_CHALLENGE/processed_data_6s_8000Hz/manifests
  max_sample_size: 320000
  min_sample_size: 1000
  min_label_size: 1  # Empty label files have Bytesize 1780, so to exclude them set this to 1780
  normalize: true
  sample_rate: 8000
  with_labels: true
  unique_labels: "['Unknown', 'Loxcur_call', 'Denmaj_drum', 'Poepal_call', 'Motcin_call', 'Carcar_call', 'Carcan_call',
               'Turmer_call', 'Prumod_song', 'Erirub_call', 'Sylund_call', 'Aegcau_call', 'Turphi_song', 'Poepal_song',
               'Sylcan_song', 'Petpet_call', 'Parcae_call', 'Alaarv_song', 'Galcri_call', 'Plasab_song', 'Galthe_song',
               'Anttri_song', 'Regign_song', 'Phycol_song', 'Fricoe_call', 'Phycol_call', 'Lyrple_song', 'Plaaff_song',
               'Chlchl_call', 'Sylmel_call', 'Oriori_song', 'Lularb_song', 'Sylund_song', 'Carcan_song', 'Strdec_song',
               'Pasdom_call', 'Corcor_call', 'Sylatr_song', 'Tetpyg_song', 'Cicatr_song', 'Strtur_song', 'Cetcet_song',
               'Serser_song', 'Parate_song', 'Cerbra_song', 'Turmer_song', 'Gargla_call', 'Sylatr_call', 'Siteur_song',
               'Lusmeg_song', 'Lusmeg_call', 'Parmaj_call', 'Pyrpyr_call', 'Regign_call', 'Embcir_song', 'Ptehey_song',
               'Parate_call', 'Serser_call', 'Cerbra_call', 'Parcae_song', 'Lopcri_call', 'Denmaj_call', 'Erirub_song',
               'Butbut_call', 'Turphi_call', 'Fricoe_song', 'Sylmel_song', 'Parmaj_song', 'Sylcan_call', 'Petpet_song',
               'Carcar_song', 'Embcir_call', 'Cisjun_song', 'Galcri_song', 'Musstr_call', 'Jyntor_song', 'Oriori_call',
               'Pelgra_call', 'Phofem_song', 'Picpic_call', 'Tibtom_song', 'Galthe_call', 'Hirrus_call', 'Stuvul_call',
               'Cicorn_song', 'Siteur_call', 'Trotro_song', 'Colpal_song', 'Human']"
  verbose_tensorboard_logging: true
  do_focal_prediction: false

dataset:
  num_workers: 20
  # original value: max_tokens: 3200000 # -> 1600 seconds
  # max_tokens / sample_rate * distributed_world_size * update_freq is the batch size in seconds
  max_tokens: 457_142
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 1000  # validate every N epochs, setting to 1000 or above effectively deactivates that
  validate_interval_updates: 125  # validate every m updates after validate_after_updates,
  # so setting this to 2000 validates every 2000 updates after validate_after_updates.
  validate_after_updates: 10000  # dont validate until reaching this many updates, but then do a
  # validate regardless of validate_interval_updates
  train_subset: train_0 # we have 2418s in train_0 and a batch size of 1600s
  valid_subset: valid_0

distributed_training:
  distributed_world_size: 4  # num of gpus -> we have 4
  ddp_backend: legacy_ddp

criterion:
  _name: finetunecriterion
  label_smoothing: 0.09  # 1 / num_classes as a rule of thumb
  report_accuracy: true
  segmentation_metrics: true
  use_focal_loss: true  # this overrides label smoothing and uses the focal loss instead
  metric_threshold: .175  # The minimum likelihood which is deemed a prediction
  method: "avg"  # Parameters for the segmentation detection
  sigma_s: 0.1
  maxfilt_s: 0.1
  max_duration_s: 0.5
  lowP: 0.125

optimization:
  update_freq: [ 7 ]
  max_update: 12000  # after the 10000 freeze updates we do 3000 normal finetuning steps -> 1323.4 epochs
  lr: [ 0.0001 ]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08

lr_scheduler:
  _name: cosine  # replaced the tri stage scheduler with a cosine one
  warmup_updates: 2000
  warmup_init_lr: 1e-10
  min_lr: 5e-06

model:
  _name: wav2vec_ccas_finetune
  w2v_path: ???
  # For the first 10k updates only the output classifier is trained,
  # after which the Transformer is also updated.
  # The feature encoder is not trained during fine-tuning.
  freeze_finetune_updates: 10000
  feature_grad_mult: 0.0
  apply_mask: true
  average_top_k_layers: 16 # Layers in the middle perform best, see arXiv:2105.11084 [cs.CL]
  # Regularization terms
  mask_prob: 1.1  # Probability - the R term in the paper - for a token being masked (Default is 0.65)
  # The masking length if a token was chosen.
  mask_length: 2
  # to get the prob from the paper you have to:
  # mask_channel_prob * num_channels (1024) / mask_channel_length / batch_size
  mask_channel_prob: 0.5
  mask_channel_length: 64
  dropout: 0.1
  dropout_input: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.2
  final_dropout: 0.0
  layerdrop: 0.1
  drop_path: 0.0
  target_mixup: true  # Should we mixup the targets as well
  source_mixup: 0.5  # The strength of the mixing (Uniformly sampled between this and 1.)
  mixup_prob: 1.0  # How much of the source and targets should be mixed up (1.0 == 100%)
  same_mixup: true  # Should we use the same strength for the full batch or use a random strength for every sample
  mixing_window_length: 0.05  # The window length for the to-be-mixed windows in BC learning
  gain_mode: "A_weighting"  # The mode with which the mixing gain is calculated, see BC learning paper
  load_pretrain_weights: false  # should we attempt to load the linear eval projection layer weights from pretrain