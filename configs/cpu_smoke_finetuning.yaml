# Reduced A2V2 workflow check for the Animal2Vec 1.0 fine-tuning baseline.
# This small profile tests implementation flow; it does not reproduce paper results.
# It expects a checkpoint from cpu_smoke_pretraining.yaml and predicts a call
# label plus the special focal label over two optimizer updates.
# Replace task.data or override it with a directory containing labeled manifests.

# CPU precision, deterministic seed, and per-update logging.
common:
  fp16: false
  seed: 7
  log_format: json
  log_interval: 1
# Write each update so freeze/resume behavior is observable in short tests.
checkpoint:
  save_dir: checkpoints/cpu_smoke_finetune
  save_interval_updates: 1
# Labeled 8 kHz audio with the toy pretraining frontend geometry.
task:
  _name: audio_ccas
  data: smoke_data/manifests
  sample_rate: 8000
  normalize: true
  with_labels: true
  unique_labels: "['call', 'focal']"
  conv_feature_layers: "[(8, 7, 1)] + [(16, 4, 2)] * 2"
  min_sample_size: 1
# A small sample budget keeps test batches cheap and single-process.
dataset:
  max_tokens: 512
  num_workers: 0
  required_batch_size_multiple: 1
  train_subset: train
  valid_subset: valid
  disable_validation: true
# CPU smoke runs use one process.
distributed_training:
  distributed_world_size: 1
# Framewise focal loss and a diagnostic probability threshold.
criterion:
  _name: finetunecriterion
  use_focal_loss: true
  metric_threshold: 0.4
# Two updates cross the one-update encoder freeze boundary.
optimization:
  update_freq: [1]
  max_update: 2
  clip_norm: 1.0
  lr: [0.001]
# Fairseq-compatible Adam for the classifier and trainable encoder parameters.
optimizer:
  _name: adam
  adam_betas: [0.9, 0.98]
  adam_eps: 1.0e-8
# No warmup is needed for this two-update diagnostic schedule.
lr_scheduler:
  _name: cosine
  warmup_updates: 0
# Load the toy pretrained encoder, mask features, and disable mixup.
model:
  _name: wav2vec_ccas_finetune
  w2v_path: checkpoints/cpu_smoke_pretrain/checkpoint_last.pt
  freeze_finetune_updates: 1
  feature_grad_mult: 0.0
  apply_mask: true
  average_top_k_layers: 2
  mask_prob: 0.5
  mask_length: 2
  mask_channel_prob: 0.25
  mask_channel_length: 2
  dropout: 0.0
  final_dropout: 0.0
  layerdrop: 0.0
  source_mixup: -1.0
  mixup_prob: 0.0
