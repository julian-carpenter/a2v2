# @package _group_

common:
  fp16: true
  log_format: json
  log_interval: 408  # log every tenth of an epoch
  tensorboard_logdir: tb
  min_loss_scale: 1e-6
  fp16_no_flatten_grads: true
  fp16_init_scale: 1

checkpoint:
  save_interval: 10  # that is every 40840 updates
  keep_last_epochs: 10  # keep all of them, as we train for 100 epochs

task:
  _name: audio_ccas
  data: /local/datasets/xeno-canto/processed_data_6s_8000Hz/manifests
  unique_labels: ""
  # Change feature extractor to account for reduced sample rate in meerkat data
  # 8000Hz / 5 / 2 / 2 / 2 / 1 / 1 / 1 -> Effective encoder output frequency of 200Hz.
  conv_feature_layers: '[(63, 125, 1)] +[(512, 10, 5)] + [(512, 3, 2)] * 3 + [(512, 3, 1)] + [(512, 2, 1)] * 2'
  min_sample_size: 1
  sample_rate: 8000
  normalize: true
  with_labels: false
  min_label_size: 1  # Empty label files have Bytesize 1780, so to exclude them set this to 1780
  verbose_tensorboard_logging: false
  enable_padding: false

dataset:
  num_workers: 32
  # max_tokens / sample_rate * distributed_world_size * update_freq is the batch size in seconds
  # For training on asmodeus, we use 960s for training, as in the paper
  max_tokens: 480_000  #  a token is a single audio frame
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 25
  validate_interval_updates: 10000  # validate every m updates
  required_batch_size_multiple: 1
  disable_validation: true
  train_subset: pretrain
  valid_subset: valid_0

distributed_training:
  distributed_world_size: 4
  ddp_backend: legacy_ddp

criterion:
  _name: expanded_model
  segmentation_metrics: true
  use_focal_loss: true  # this overrides label smoothing and uses the focal loss instead
  log_keys:
    - ema_decay
    - target_var
    - pred_var
    - model_norm
    - ema_norm
    - masked_pct

optimization:
  update_freq: [ 4 ]
  max_update: 408402  # 4084.02 updates are one epoch, so we train for 100 epochs
  clip_norm: 1

optimizer:
  _name: composite
  dynamic_groups: true
  groups:
    default:
      lr_float: 0.0001
      optimizer:
        _name: adam
        adam_betas: [ 0.9,0.98 ]
        adam_eps: 1e-06
        weight_decay: 0.01
      lr_scheduler:
        _name: cosine
        warmup_updates: 10000

lr_scheduler: pass_through
#optimizer:
#  _name: adam
#  adam_betas: [ 0.9,0.98 ]
#  adam_eps: 1e-06
#  weight_decay: 0.01
#
#lr_scheduler:
#  _name: cosine
#  warmup_updates: 8000
#  warmup_init_lr: 1e-8
#  min_lr: 5e-7

model:
  _name: data2vec_multi
  loss_beta: 0
  loss_scale: null

  depth: 16
  embed_dim: 1024
  num_heads: 16

  clone_batch: 12

  ema_decay: 0.9997
  ema_end_decay: 1
  ema_anneal_end_step: 300000
  ema_encoder_only: false

  average_top_k_layers: 16
  instance_norm_target_layer: true
  layer_norm_target_layer: false
  layer_norm_targets: false

  layerdrop: 0
  norm_eps: 1e-5

  supported_modality: AUDIO

  modalities:
    audio:
      sinc_input: true
      conv_pos_depth: 5
      conv_pos_width: 95
      conv_pos_groups: 16
      prenet_depth: 8  # The depth of the transformer based context_encoder
      # mask_prob: 0.5
      # mask_length: 5
      mask_prob: 1.5  # Probability for a token being masked (Default is 0.65)
      # The masking length if a token was chosen.
      # This mask_prob and mask_length will mask ~93% of the input with a median masking length of 100 ms
      mask_length: 2
      mask_prob_adjust: 0.05
      inverse_mask: false
      mask_noise_std: 0.01
      mask_dropout: 0
      add_masks: false
      ema_local_encoder: false
      use_alibi_encoder: true
      prenet_layerdrop: 0
      prenet_dropout: 0.1
      learned_alibi_scale: true
      learned_alibi_scale_per_head: true
      decoder:
        input_dropout: 0.1
        decoder_dim: 768
        decoder_groups: 16
        decoder_kernel: 7
        decoder_layers: 4
